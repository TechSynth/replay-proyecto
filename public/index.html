<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rePLAY - Streaming Musical</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h1>rePLAY</h1>
            </div>

            <nav class="main-nav">
                <ul>
                    <li class="active">
                        <a href="#" data-view="home">
                            <i class="fas fa-home"></i>
                            <span>Inicio</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-view="search">
                            <i class="fas fa-search"></i>
                            <span>Buscar</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-view="library">
                            <i class="fas fa-book"></i>
                            <span>Mi Biblioteca</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-view="upload">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Subir Música</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="playlists">
                <h3>Mis Playlists</h3>
                <ul id="playlist-list">
                    <!-- carga de playlist -->
                </ul>
            </div>
        </aside>

        <!-- contenido principal -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="¿Qué quieres escuchar?">
                    <button id="search-btn">Buscar</button>
                </div>
                <div class="user-menu">
                    <span id="user-name">Usuario Demo</span>
                    <button id="logout-btn" class="logout-btn" title="Cerrar sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <section id="home-view">
                    <h2>Canciones Recientes</h2>
                    <div class="songs-grid" id="songs-grid">
                        <!-- Las canciones se cargarán aquí -->
                    </div>
                </section>

                <section id="search-view" style="display: none;">
                    <h2>Resultados de Búsqueda</h2>
                    <div class="songs-grid" id="search-results">
                        <!-- Resultados de búsqueda -->
                    </div>
                </section>

                <section id="library-view" style="display: none;">
                    <div class="view-header">
                        <h2>Mi Biblioteca</h2>
                        <div class="view-toggles">
                            <button id="grid-view-btn" class="view-btn active" title="Vista Cuadrícula">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button id="list-view-btn" class="view-btn" title="Vista Lista">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                    </div>
                    <div id="library-grid" class="songs-grid">
                        <!-- canciones subidas por el usuario -->
                    </div>
                    <div id="library-list" class="songs-list" style="display: none;">
                        <div class="list-header">
                            <div class="col-cover">#</div>
                            <div class="col-title">título</div>
                            <div class="col-album">álbum</div>
                            <div class="col-date">fecha subida</div>
                        </div>
                        <div id="library-list-items">
                            <!-- items de lista -->
                        </div>
                    </div>
                </section>

                <section id="upload-view" style="display: none;">
                    <h2>Subir Nueva Canción</h2>
                    <div class="upload-container">
                        <div class="upload-info">
                            <p>puedes subir hasta 3 canciones (máximo 10mb por archivo).</p>
                        </div>
                        <form id="upload-form" class="standard-form">
                            <div class="form-group">
                                <label for="upload-title">título de la canción</label>
                                <input type="text" id="upload-title" placeholder="ej: mi gran éxito" required>
                            </div>
                            <div class="form-group">
                                <label for="upload-artist">artista</label>
                                <input type="text" id="upload-artist" placeholder="ej: nombre del artista">
                            </div>
                            <div class="form-group">
                                <label for="upload-file">archivo de audio (.mp3)</label>
                                <input type="file" id="upload-file" accept="audio/mpeg" required>
                            </div>
                            <div class="form-group">
                                <label for="upload-image">carátula (opcional, .jpg o .png)</label>
                                <input type="file" id="upload-image" accept="image/*">
                            </div>
                            <button type="submit" class="auth-btn" id="upload-submit-btn">
                                <i class="fas fa-upload"></i> subir a la nube
                            </button>
                        </form>
                        <div id="upload-status" class="upload-status" style="display: none;"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Reproductor de música -->
    <footer class="player">
        <div class="player-left">
            <div class="song-info">
                <div class="song-image">
                    <i class="fas fa-music"></i>
                </div>
                <div class="song-details">
                    <div class="song-title" id="current-song-title">Selecciona una canción</div>
                    <div class="song-artist" id="current-song-artist">-</div>
                </div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="prev-btn">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" id="play-btn">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="next-btn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            <div class="player-progress">
                <span class="time" id="current-time">0:00</span>
                <div class="progress-bar">
                    <div class="progress-filled" id="progress-filled"></div>
                </div>
                <span class="time" id="total-time">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <button class="control-btn" id="volume-btn">
                <i class="fas fa-volume-up"></i>
            </button>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="70">
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>

</html>
